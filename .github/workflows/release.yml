name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run tests
        run: pytest -q

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/p/clovord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Notify build webhook for clovord.py release
        if: always()
        env:
          API_BASE_URL: ${{ secrets.ORG_API_BASE_URL }}
          BUILD_WEBHOOK_TOKEN: ${{ secrets.CLOVORD_BUILD_WEBHOOK_SECRET || secrets.ORG_API_BUILD_WEBHOOK_SECRET }}
        run: |
          set -e
          BUILD_MESSAGE="$(git log -1 --pretty=%B | tr -d '\r' | sed 's/^\s*//;s/\s*$//')"
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              package_version = str(tomllib.load(handle)["project"]["version"]).strip()

          api_base = os.environ["API_BASE_URL"].rstrip("/")
          url = f"{api_base}/v1/webhooks/builds"
          token = os.environ["BUILD_WEBHOOK_TOKEN"]
          release_message = os.environ.get("BUILD_MESSAGE", "").strip() or f"Release {package_version}"
          payload = {
              "action": "request",
              "commit": os.environ["GITHUB_SHA"],
              "message": release_message,
              "target_types": ["library"],
              "metadata": {
                  "library": "clovord.py",
                  "version": package_version,
                  "download_url": f"https://pypi.org/project/clovord.py/{package_version}/",
              },
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, method="POST")
          req.add_header("Content-Type", "application/json")
          req.add_header("X-Clovord-Build-Token", token)
          try:
              with urllib.request.urlopen(req, timeout=20) as res:
                  body = res.read().decode("utf-8")
                  print("status:", res.status)
                  print("response:", body)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8") if exc.fp else ""
              print("http_error:", exc.code)
              print("response:", body)
              raise
          PY
