name: Changelog

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.5 (optional for tag-triggered runs)"
        required: false
      since_tag:
        description: "Optional tag to start from, e.g. v0.1.4"
        required: false

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update changelog
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_SINCE_TAG: ${{ github.event.inputs.since_tag }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Version could not be resolved. Provide workflow input 'version' or run on a v* tag."
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [ -n "$INPUT_SINCE_TAG" ]; then
            python tools/update_changelog.py --version "$VERSION" --since-tag "$INPUT_SINCE_TAG"
          else
            python tools/update_changelog.py --version "$VERSION"
          fi

      - name: Switch to default branch for commit
        if: github.ref_type == 'tag'
        env:
          INPUT_SINCE_TAG: ${{ github.event.inputs.since_tag }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"

          # Re-run generation on branch tip to avoid committing on detached tag state.
          if [ -n "$INPUT_SINCE_TAG" ]; then
            python tools/update_changelog.py --version "$VERSION" --since-tag "$INPUT_SINCE_TAG"
          else
            python tools/update_changelog.py --version "$VERSION"
          fi

      - name: Commit changelog
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md
          git commit -m "docs(changelog): update for v$VERSION" || echo "No changes"
          git push origin "HEAD:$DEFAULT_BRANCH"
